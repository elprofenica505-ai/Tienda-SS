name: CI

on:
  push:
    branches: [main, master, develop, SaaS-MultiTenant-Profesional]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate operational scripts
        run: bash -n scripts/backup-firestore.sh scripts/restore-firestore.sh

      - name: Production dependency audit
        # firebase-tools and Playwright are development-only tooling. The gate
        # blocks critical vulnerabilities in packages shipped to production;
        # non-critical advisories remain visible in the audit output for review.
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application > sbom.cdx.json

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Firestore rules tests
        run: npm run test:rules

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  e2e-staging:
    if: vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run staging journeys
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_RUN_MUTATIONS: 'true'
          E2E_RUN_REGISTRATION: 'false'
          E2E_HAS_CUSTOMER: ${{ vars.E2E_HAS_CUSTOMER }}
          E2E_INVITATION_TOKEN: ${{ secrets.E2E_INVITATION_TOKEN }}
          E2E_MEMBER_ID_TOKEN: ${{ secrets.E2E_MEMBER_ID_TOKEN }}
          E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
          E2E_TENANT_ID: ${{ secrets.E2E_TENANT_ID }}
        run: npm run test:e2e:ci
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
